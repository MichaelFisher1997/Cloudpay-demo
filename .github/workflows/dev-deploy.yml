name: Plan / apply DEV infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      reviewed_revision:
        type: string
        description: For apply, the commit SHA from the reviewed plan run

permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: godiffy-dev-deployment
  cancel-in-progress: false

jobs:
  dev:
    if: github.repository == 'MichaelFisher1997/Cloudpay-demo' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-west-2
      AWS_PAGER: ""
      TF_IN_AUTOMATION: "true"
      TF_WORKSPACE: default
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Require the reviewed code revision for apply
        if: inputs.operation == 'apply'
        env:
          REVIEWED_REVISION: ${{ inputs.reviewed_revision }}
        run: test "$REVIEWED_REVISION" = "$GITHUB_SHA"
      - name: Authenticate to AWS DEV using OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-2
          role-to-assume: arn:aws:iam::218549829565:role/cloudpay-demo-github-actions
          allowed-account-ids: "218549829565"
          role-duration-seconds: 3600
          unset-current-credentials: true
      - name: Initialize and validate Terraform
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false -lockfile=readonly -backend-config=backend.hcl
          terraform validate
      - name: Terraform plan
        working-directory: terraform/environments/dev
        run: |
          umask 077
          terraform plan -input=false -no-color -lock-timeout=120s -var-file=release.tfvars.json -out=dev.tfplan
          printf 'Code revision: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Apply the saved plan
        if: inputs.operation == 'apply'
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -no-color dev.tfplan
