name: AWS OIDC identity check

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/aws-oidc-check.yml

permissions: {}

jobs:
  aws-identity:
    name: Verify AWS identity via OIDC
    if: github.repository == 'MichaelFisher1997/Cloudpay-demo' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    env:
      AWS_REGION: eu-west-2
      AWS_PAGER: ""
    steps:
      - name: Assume repository role using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::218549829565:role/cloudpay-demo-github-actions
          allowed-account-ids: "218549829565"
          role-duration-seconds: 900
          role-session-name: cloudpay-oidc-${{ github.run_id }}-${{ github.run_attempt }}
          unset-current-credentials: true
          action-timeout-s: 120

      - name: Show assumed-role identity
        run: aws sts get-caller-identity --region "$AWS_REGION" --output json --no-cli-pager
